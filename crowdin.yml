project_id_env: "CROWDIN_PROJECT_ID"
api_token_env: "CROWDIN_PERSONAL_TOKEN"

preserve_hierarchy: true

files:
  - source: '/src/main/composeResources/values/strings.xml'
    translation: '/src/main/composeResources/values-%android_code%/strings.xml'
    dest: '/Desktop/strings.xml'
    skip_untranslated_strings: true
    escape_quotes: 0
    escape_special_characters: 0

  - source: '/src/main/composeResources/values/plurals.xml'
    translation: '/src/main/composeResources/values-%android_code%/plurals.xml'
    dest: '/Desktop/plurals.xml'
    skip_untranslated_strings: true
    escape_quotes: 0
    escape_special_characters: 0
