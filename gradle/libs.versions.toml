[versions]
# Core
junit = "6.1.3"
kotlin = "2.4.21"

# CLI
picocli = "4.7.7"
arsclib = "4695b583ef"
morphe-patcher = "2.0.1"
morphe-library = "1.4.0"

# Compose Desktop
compose = "1.12.2"
material3 = "1.9.0"

# Networking
ktor = "3.6.0"

# DI
koin-bom = "4.2.2"

# Navigation
navigation = "2.9.2"

# Async / Serialization
coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"

# JNA (Windows DWM title bar tinting)
jna = "5.19.1"

# FileKit (native file/folder pickers across Win/macOS/Linux)
filekit = "0.16.0"

# Logging
slf4j = "2.0.20"

# Libraries
about-libraries = "15.3.0"
oshi = "7.7.2"

[libraries]
# Morphe Core
arsclib = { module = "com.github.MorpheApp:ARSCLib", version.ref = "arsclib" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
morphe-library = { module = "app.morphe:morphe-library-jvm", version.ref = "morphe-library" }

# Ktor Client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# Koin
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose" }

# Navigation
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }

# Koin ViewModel
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# JNA (Windows DWM title bar tinting)
jna-core = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

# Compose Desktop
compose-desktop-macos-arm64 = { module = "org.jetbrains.compose.desktop:desktop-jvm-macos-arm64", version.ref = "compose" }
compose-desktop-macos-x64 = { module = "org.jetbrains.compose.desktop:desktop-jvm-macos-x64", version.ref = "compose" }
compose-desktop-linux-x64 = { module = "org.jetbrains.compose.desktop:desktop-jvm-linux-x64", version.ref = "compose" }
compose-desktop-linux-arm64 = { module = "org.jetbrains.compose.desktop:desktop-jvm-linux-arm64", version.ref = "compose" }
compose-desktop-windows-x64 = { module = "org.jetbrains.compose.desktop:desktop-jvm-windows-x64", version.ref = "compose" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }

# OSHI (cross-platform CPU / I/O telemetry)
oshi-core = { module = "com.github.oshi:oshi-core", version.ref = "oshi" }

# FileKit: native OS file/folder pickers (JNA on Win/macOS, XDG Desktop Portal on Linux)
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }

# Testing
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Logging
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }

# About Libraries
about-libraries-core = { group = "com.mikepenz", name = "aboutlibraries-compose-core", version.ref = "about-libraries" }

[bundles]
compose-desktop = [
    "compose-desktop-macos-arm64",
    "compose-desktop-macos-x64",
    "compose-desktop-linux-x64",
    "compose-desktop-linux-arm64",
    "compose-desktop-windows-x64",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
about-libraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "about-libraries" }
